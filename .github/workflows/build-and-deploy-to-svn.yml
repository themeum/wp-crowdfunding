name: Build and Deploy to SVN
on:
  push:
    tags:
      - "*"
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '14.17.5'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Extract version number
        id: get_version
        run: |
          version=$(grep -Po 'Version:\s*\K[\d.]+(?:-[\w]+)?' wp-crowdfunding.php)
          echo "VERSION_NUMBER=$version" >> $GITHUB_ENV

      - name: Build project
        run: npm run build

      # ubuntu-latest no longer includes SVN. The deploy action installs it via
      # apt-get update, which fails when GitHub's preinstalled Microsoft repos
      # (azure-cli, microsoft-prod) return 403. Install SVN ourselves first.
      - name: Install Subversion
        run: |
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list
          sudo apt-get update
          sudo apt-get install -y subversion

      - name: WordPress Plugin Deploy
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          dry-run: false
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          BUILD_DIR: build/wp-crowdfunding

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: ./wp-crowdfunding-${{ env.VERSION_NUMBER }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ env.VERSION_NUMBER }}
          RELEASE_NAME: ${{ env.VERSION_NUMBER }} Release